spring:
  application:
    name: graph-explorer
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:changeme123}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  graph:
    max-traversal-depth: ${GRAPH_MAX_DEPTH:4}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.swetha.graphexplorer: INFO
